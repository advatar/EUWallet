[package]
name = "crypto-backend"
description = "aws-lc-rs implementation of the crypto-traits boundary (verify/digest/kdf/aead/random) + a software signer for tests/issuers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
crypto-traits = { path = "../crypto-traits" }
hybrid-pq = { path = "../hybrid-pq" }
aws-lc-rs = { workspace = true }
ml-dsa = { workspace = true, optional = true }
ml-kem = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[features]
default = []
experimental-pq-primitives = ["dep:ml-dsa", "dep:ml-kem", "dep:zeroize"]

[dev-dependencies]
# Integration tests exercise REAL crypto through the actual codecs (acyclic: these depend on
# crypto-traits, not on crypto-backend).
cose = { path = "../cose" }
mdoc = { path = "../mdoc" }
sdjwt = { path = "../sdjwt" }
x509 = { path = "../x509" }
oid4vp = { path = "../oid4vp" }
oid4vci = { path = "../oid4vci" }
payment = { path = "../payment" }
serde_json = { workspace = true }
base64ct = { workspace = true }

[lints]
workspace = true
