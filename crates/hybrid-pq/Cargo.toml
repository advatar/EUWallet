[package]
name = "hybrid-pq"
description = "Isolated experimental hybrid post-quantum types and cryptographic trait boundaries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Compile-time opt-in for experimental hybrid-PQ runtime enablement (plan section 17, issue #94).
# Release builds omit this feature, so the effective rollout mode is always Disabled.
experimental-hybrid-pq = []

[dev-dependencies]
ciborium = { workspace = true }
crypto-traits = { path = "../crypto-traits" }
proptest = { workspace = true }

[lints]
workspace = true
