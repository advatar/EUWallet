name: EUWalletDemo
options:
  bundleIdPrefix: eu.advatar.wallet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  AusweisApp2SDKWrapper:
    url: https://github.com/Governikus/AusweisApp2Wrapper-iOS-SPM
    exactVersion: 2.5.4

settings:
  base:
    # Swift 5 language mode: the shell predates Swift 6 strict-concurrency and the demo harness
    # favours legibility over actor annotations. The core's safety lives in Rust, not here.
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  EUWalletDemo:
    type: application
    platform: iOS
    entitlements:
      path: App/EUWalletDemo.entitlements
      properties:
        com.apple.developer.default-data-protection: NSFileProtectionComplete
        com.apple.developer.identity-document-services.document-provider.mobile-document-types:
          - eu.europa.ec.av.1
          - org.iso.23220.photoid.1
          - org.iso.18013.5.1.mDL
          - eu.europa.ec.eudi.pid.1
        com.apple.developer.nfc.readersession.formats:
          - TAG
        # Shared, non-sensitive status container for the widgets/controls (document count only).
        com.apple.security.application-groups:
          - group.eu.advatar.wallet
        # Remote notifications (VCIssuer pushes status updates). "development" for dev/TestFlight.
        aps-environment: development
    sources:
      - path: App
      # The thin native shell (renderer, effect executor, signer, transports, storage) and the
      # UniFFI-generated bindings compile straight into the app module — one module, no imports.
      - path: Sources/WalletShell
      - path: Generated/wallet_core.swift
      # Status store + deep-link model + App Intents, shared with the widget extension.
      - path: Shared
    dependencies:
      # Embeds the WidgetKit extension (Home/Lock Screen widgets + Control Center controls).
      - target: EUWalletWidgets
      # Embeds the watchOS companion app (document-count glance + quick actions over
      # WatchConnectivity). No private SDKs — builds in advatar CI from the base spec too.
      - target: EUWalletWatch
        embed: true
      # The real Rust wallet core, cross-compiled for device + simulator by
      # build-rust-xcframework.sh. Static libs → link, don't embed.
      - framework: WalletCore.xcframework
        embed: false
        link: true
      - package: AusweisApp2SDKWrapper
      # Apple requires the provider authorization UI extension whenever the host declares the
      # Digital Credentials mobile-document entitlement. A target dependency embeds the .appex.
      - target: EUWalletDocumentProvider
    settings:
      base:
        # Pin the bundle wrapper and Mach-O name together. Without this, a manual/cached Xcode
        # PRODUCT_NAME override can stage EUWallet.app while Info.plist still points elsewhere.
        PRODUCT_NAME: EUWallet
        EXECUTABLE_NAME: EUWallet
        PRODUCT_BUNDLE_IDENTIFIER: eu.advatar.wallet
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "EU Wallet"
        INFOPLIST_KEY_NSCameraUsageDescription: "Use the camera to scan QR codes when adding an ID or sharing information."
        INFOPLIST_KEY_NFCReaderUsageDescription: "Hold your ID card to your iPhone to add your verified ID."
        DEVELOPMENT_TEAM: L2AF8KFX35
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Standard, exempt encryption only (AES-GCM / ECDH / TLS via the platform + aws-lc). Declaring
        # this lets every TestFlight build distribute immediately instead of stalling on a manual
        # export-compliance question each upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        # The xcframework vends the `wallet_coreFFI` clang module via its bundled module.modulemap.
        OTHER_LDFLAGS: "-lc++"
        # AusweisApp 2.5.4's official module map still loads its deprecated compatibility header
        # alongside AusweisApp.h. Suppress only that upstream pragma message; our adapter imports
        # the supported Swift wrapper and never imports AusweisApp2.h directly.
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -Wno-#pragma-messages"
    postBuildScripts:
      - name: Verify installable app bundle
        script: '"${SRCROOT}/verify-app-bundle.sh" "${TARGET_BUILD_DIR}/${WRAPPER_NAME}"'
        basedOnDependencyAnalysis: false

  EUWalletDocumentProvider:
    type: extensionkit-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: DocumentProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.advatar.wallet.document-provider
        PRODUCT_NAME: EUWalletDocumentProvider
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: DocumentProvider/Info.plist
        DEVELOPMENT_TEAM: L2AF8KFX35
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  # Shared capture framework for the standalone PID Capture companion (app + App Clip). Contains the
  # VCIssuer capture-session client, the MRZ scanner, and the ChipmunkNFC/iProov provider wrappers.
  # Builds in CI without the private SDKs: the wrappers compile to fail-closed `#if canImport` stubs;
  # project.local.yml links the real ChipmunkNFC + iProov to this framework on a provisioned machine.
  CaptureKit:
    type: framework
    platform: iOS
    sources:
      - path: CaptureKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.advatar.wallet.capturekit
        PRODUCT_NAME: CaptureKit
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: L2AF8KFX35
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  # The standalone PID Capture companion. Reads the eMRTD chip + runs liveness and hands the evidence
  # to VCIssuer, which issues a PID to a DIFFERENT wallet. No size budget — the guaranteed path.
  PIDCapture:
    type: application
    platform: iOS
    entitlements:
      path: PIDCapture/PIDCapture.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:issuer.advatar.systems
        com.apple.developer.nfc.readersession.formats:
          - TAG
    sources:
      - path: PIDCapture
    dependencies:
      - target: CaptureKit
        embed: true
      - target: PIDCaptureClip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.advatar.wallet.pidcapture
        PRODUCT_NAME: PIDCapture
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "PID Capture"
        INFOPLIST_KEY_NSCameraUsageDescription: "Use the camera to scan the machine-readable zone on your passport."
        INFOPLIST_KEY_NFCReaderUsageDescription: "Hold your passport to your iPhone to read its chip."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        DEVELOPMENT_TEAM: L2AF8KFX35
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"

  # The App Clip variant of the companion — instant launch from an App Clip Code / QR, no full install.
  # Links CaptureKit only (never wallet code) to stay under the 15 MB budget; see
  # docs/nfc-pid/appclip-size-feasibility.md.
  PIDCaptureClip:
    type: application.on-demand-install-capable
    platform: iOS
    entitlements:
      path: PIDCaptureClip/PIDCaptureClip.entitlements
      properties:
        com.apple.developer.parent-application-identifiers:
          - $(AppIdentifierPrefix)eu.advatar.wallet.pidcapture
        com.apple.developer.associated-domains:
          - appclips:issuer.advatar.systems
    sources:
      - path: PIDCaptureClip
    dependencies:
      - target: CaptureKit
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.advatar.wallet.pidcapture.Clip
        PRODUCT_NAME: PIDCaptureClip
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PIDCaptureClip/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: L2AF8KFX35
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  # WidgetKit extension: Home Screen + Lock Screen widgets and (iOS 18) Control Center controls.
  # Reads only a non-sensitive document count from the shared App Group — never credential data.
  # No private SDKs, so it lives in the base spec and builds in CI.
  EUWalletWidgets:
    type: app-extension
    platform: iOS
    entitlements:
      path: Widgets/EUWalletWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.eu.advatar.wallet
    sources:
      - path: Widgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.advatar.wallet.widgets
        PRODUCT_NAME: EUWalletWidgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widgets/Info.plist
        DEVELOPMENT_TEAM: L2AF8KFX35
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"

  # watchOS companion (single-target watchOS app, watchOS 10+). A privacy-safe glance: mirrors the
  # document COUNT from the paired iPhone over WatchConnectivity and offers scan/share quick actions
  # that nudge the phone. No wallet-core, no credentials, no private SDKs.
  EUWalletWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.advatar.wallet.watchkitapp
        PRODUCT_NAME: EU Wallet
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WatchApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: L2AF8KFX35
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "4"

  # Runs the REAL Rust core (aws-lc-rs, compiled for the simulator) end to end, on the simulator.
  # Deterministic proof that the flows work on-device, independent of UI screenshotting.
  EUWalletDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/OnSim
      - path: Sources/WalletShell
      - path: Generated/wallet_core.swift
      - path: App/DemoAdapters.swift
    dependencies:
      - target: EUWalletDemo
      - framework: WalletCore.xcframework
        embed: false
        link: true
      - package: AusweisApp2SDKWrapper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.advatar.wallet.tests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: L2AF8KFX35
        CODE_SIGN_STYLE: Automatic
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/EUWallet.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/EUWallet"
        OTHER_LDFLAGS: "-lc++"

  EUWalletDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: EUWalletDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.advatar.wallet.uitests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: L2AF8KFX35
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: EUWalletDemo

  # A deliberately minimal EUDI "test wallet" that exercises the cross-wallet PID Capture flow: it
  # creates a capture session bound to its own key, launches the PIDCapture companion, and DISPLAYS
  # the PID it is offered (via the openid-credential-offer:// hand-off or by polling). It stores
  # nothing, does no NFC/liveness itself, links no private SDKs — so it builds in CI from the base
  # spec (no project.local.yml entry needed).
  TestWallet:
    type: application
    platform: iOS
    sources:
      - path: TestWallet
      - path: App/QRScannerView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.advatar.wallet.testwallet
        PRODUCT_NAME: PIDTestWallet
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TestWallet/Info.plist
        DEVELOPMENT_TEAM: L2AF8KFX35
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  TestWallet:
    build:
      targets:
        TestWallet: all
    run:
      config: Debug
    archive:
      config: Release
  PIDCapture:
    build:
      targets:
        PIDCapture: all
    run:
      config: Debug
    archive:
      config: Release
  EUWalletDemo:
    build:
      targets:
        EUWalletDemo: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EUWalletDemoTests
        - EUWalletDemoUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
